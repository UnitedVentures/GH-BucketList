<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Destination. Every Month. Like No Other.</title>

    <!-- Theme (light/dark) — set before first paint so a returning
         dark-mode visitor never sees a flash of the light default.
         See src/hooks/useTheme.js, which reads this same attribute. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bucketlist:theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
